  function updateStepper(step) {

    const node2 = document.getElementById('step-node-2');

    const label2 = document.getElementById('step-label-2');
    const label3 = document.getElementById('step-label-3');

    if (!pLine || !node1) return;

    if (step === 1) {
      pLine.style.width = '0%';
      node1.className = 'w-8 h-8 rounded-full flex items-center justify-center font-body-strong text-body-strong bg-primary-container text-surface-white transition-colors';
      node1.innerHTML = '1';
      label1.className = 'mt-2 font-body-strong text-body-strong text-primary-container';

      node2.className = 'w-8 h-8 rounded-full flex items-center justify-center font-body-strong text-body-strong bg-table-header-fog text-text-slate transition-colors';
      node2.innerHTML = '2';
      label2.className = 'mt-2 font-body-default text-body-default text-text-slate';

      node3.className = 'w-8 h-8 rounded-full flex items-center justify-center font-body-strong text-body-strong bg-table-header-fog text-text-slate transition-colors';

      pLine.style.width = '50%';
      node1.className = 'w-8 h-8 rounded-full flex items-center justify-center font-body-strong text-body-strong bg-primary-container text-surface-white transition-colors';

      node2.className = 'w-8 h-8 rounded-full flex items-center justify-center font-body-strong text-body-strong bg-primary-container text-surface-white transition-colors';

  function setFrame(frameKey) {
    const singleViewport = document.getElementById('single-frame-viewport');
    const compareContainer = document.getElementById('compare-all-container');
    const contentArea = document.getElementById('frame-content-area');

    // Reset button states
    ['1', '2', '3', '4', '5', '6', 'all'].forEach(k => {
      const btn = document.getElementById('btn-frame-' + k);
      if (btn) {
        btn.className = 'px-3 py-1.5 rounded font-caption text-caption font-semibold transition-colors bg-table-header-fog text-text-slate hover:text-text-ink';
      }
    });

    const activeBtn = document.getElementById('btn-frame-' + frameKey);
    if (activeBtn) {
      activeBtn.className = 'px-3 py-1.5 rounded font-caption text-caption font-semibold transition-colors bg-primary-container text-surface-white';
    }

    if (frameKey === 'all') {
      singleViewport.classList.add('hidden');
      compareContainer.classList.remove('hidden');
      compareContainer.innerHTML = '';

      Object.keys(frames).forEach(id => {
        const item = frames[id];
        const section = document.createElement('div');
        section.className = 'border-2 border-border-line rounded-xl p-6 bg-background-cloud';
        section.innerHTML = `
          <div class="flex items-center justify-between pb-4 mb-6 border-b border-border-line">

            </div>
            <button onclick="setFrame(${id})" class="text-primary-container font-caption text-caption font-semibold hover:underline">Focus single frame →</button>
          </div>
          ${item.html}
        `;
        compareContainer.appendChild(section);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      compareContainer.classList.add('hidden');
      singleViewport.classList.remove('hidden');

      const data = frames[frameKey];
      updateStepper(data.step);
      contentArea.innerHTML = data.html;
    }
  }

  // Initialize on Frame 1
  setFrame(1);
